<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7B5CFF">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="دفتر نور">
<title>دفتر نور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first day page — progress ring + small routine box, then four colored section cards (ديني/نفسي/علمي/تطوير) + work; bottom tab bar. Wide screens: routine becomes a sticky sidebar. */
:root{
  --bg:#F5F2FF; --paper:#FFFFFF; --ink:#2A2140; --muted:#857BA0; --line:#E7E1FA; --tint:#EFEAFF;
  --accent:#7B5CFF; --accent-2:#FF7E9D; --accent-3:#FFB86B; --on:#FFFFFF; --late:#E0475F;
  --din:#0FA897; --din-s:#DDF6F1; --nafs:#F2557F; --nafs-s:#FFE4EC; --ilm:#6E56F0; --ilm-s:#ECE8FF;
  --dev:#F08C1A; --dev-s:#FFEFD9; --work:#8C7FB0; --work-s:#EEEAF7;
  color-scheme:light;
  --font:"Baloo Bhaijaan 2",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:28px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:6px;line-height:1.2}
h1 svg{width:28px;height:28px;animation:sway 6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(18deg)}}
.date{color:var(--muted);font-size:12.5px;text-align:left;line-height:1.35}
.hello{margin:2px 0 14px;font-size:17px;font-weight:700}
.hello span{font-weight:400;color:var(--muted);font-size:14px}

.view{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px}
.top{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 6px 16px -14px var(--accent)}
.ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(160deg,var(--paper),var(--tint))}
.ring svg{width:104px;height:104px}
.ring small{color:var(--muted);font-size:13px}
.rt h3{margin:0 0 4px;font-size:14px;color:var(--accent)}
.rt ul{list-style:none;margin:0;padding:0}
.rt li{display:flex;gap:7px;align-items:center;padding:1px 4px;margin:0 -4px;font-size:13px;border-radius:8px}
.rt li b{font-weight:400;color:var(--muted);width:38px;flex:none;font-variant-numeric:tabular-nums;font-size:12px}
.rt li i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--accent);flex:none}
.rt li.d i{background:var(--accent)}
.rt li.d span{color:var(--muted);text-decoration:line-through}
.rt li.now{background:var(--tint);font-weight:700}

.sec{border-radius:22px;overflow:hidden;background:var(--paper);border:1px solid var(--line)}
.sec>header{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;color:var(--paper);font-weight:800;font-size:18px;background:var(--c)}
.sec>header em{font-style:normal;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--paper) 28%,transparent);padding:1px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
.din{--c:var(--din);--s:var(--din-s)} .nafs{--c:var(--nafs);--s:var(--nafs-s)} .ilm{--c:var(--ilm);--s:var(--ilm-s)} .dev{--c:var(--dev);--s:var(--dev-s)} .work{--c:var(--work);--s:var(--work-s)}
.body{padding:10px 16px 14px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:5px;display:flex;justify-content:space-between;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--c);color:var(--c);background:transparent;border-radius:99px;padding:3px 13px;font-size:14px;font-weight:600;transition:background .15s,color .15s}
.chip.on{background:var(--c);color:var(--paper)}
.chip:active{transform:scale(.95)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);min-width:0}
.row:last-child{border-bottom:0}
.ck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--c);background:transparent;display:grid;place-items:center;padding:0;color:var(--paper)}
.ck.on{background:var(--c)}
.ck.on::after{content:"";width:9px;height:5px;border:2px solid currentColor;border-top:0;border-right:0;transform:rotate(-45deg) translate(0,-1px)}
.ck:active{transform:scale(.88)}
.txt{flex:1;min-width:0;overflow-wrap:anywhere}
.row.done .txt{color:var(--muted);text-decoration:line-through}
.meta{flex:none;color:var(--muted);font-size:12px}
.meta.late{color:var(--late);font-weight:700}
.x{flex:none;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.empty{color:var(--muted);font-size:13px}

.water{display:flex;align-items:center;gap:12px;background:var(--s);border-radius:16px;padding:8px 12px}
.water svg{width:34px;height:56px;flex:none}
.water .wt{flex:1;min-width:0}
.water .wt b{display:block;font-size:15px}
.water .wt span{font-size:12.5px;color:var(--muted)}
.wbtns{display:flex;gap:6px}
.wbtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--c);color:var(--paper);font-size:20px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0}
.wbtn.minus{background:transparent;color:var(--c);border:1.5px solid var(--c)}

.focus{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.fc{display:flex;gap:8px;align-items:center;text-align:right;background:var(--s);border:0;border-radius:14px;padding:8px 10px;min-width:0}
.fc .t{flex:1;min-width:0}
.fc small{display:block;font-size:11.5px;color:var(--c);font-weight:700}
.fc span{font-size:14.5px;font-weight:700}
.fc.done span{color:var(--muted);text-decoration:line-through}
.course{border:1px solid var(--s);border-radius:14px;padding:8px 10px;background:color-mix(in srgb,var(--s) 35%,var(--paper))}
.course .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-size:14.5px;margin-bottom:6px}
.course .t small{color:var(--muted);font-weight:400;font-size:12px}
.boxes{display:flex;flex-wrap:wrap;gap:6px}
.box{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--c);color:var(--c);background:transparent;display:grid;place-items:center;font-size:14px;font-weight:700;padding:0;font-variant-numeric:tabular-nums}
.box.on{background:var(--c);color:var(--paper)}
.box.next{border-width:2.5px;box-shadow:0 0 0 3px var(--s)}
.box.locked{opacity:.45}
.note{font-size:12.5px;color:var(--muted)}
.hs{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.hn{font-size:13.5px;font-weight:700;color:var(--c)}
.hn small{color:var(--muted);font-weight:400}
.box.pg{width:auto;min-width:42px;padding:0 6px;font-size:13px}
.sec>header{flex-wrap:wrap}
.hbar{flex-basis:100%;height:4px;border-radius:99px;background:color-mix(in srgb,var(--paper) 35%,transparent);margin-top:6px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--paper);border-radius:99px}
.fold{border:1px solid var(--s);border-radius:14px;background:color-mix(in srgb,var(--s) 30%,var(--paper))}
bdi{white-space:nowrap}
.card>.fold{border:0;background:transparent}
.card>.fold>summary{padding:0}
.card>.fold>.in{padding:8px 0 0}
.fold>summary{padding:8px 12px;color:var(--c);display:flex;justify-content:space-between;align-items:center;gap:8px}
.fold>summary small{color:var(--muted);font-weight:500;font-size:12.5px}
.fold>summary::after{content:"⌄";font-size:16px;line-height:1;transition:transform .2s}
.fold[open]>summary::after{transform:rotate(180deg)}
.fold>.in{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.fold .course{background:var(--paper)}
.subj{background:var(--paper);border:1px solid var(--s);border-radius:12px;padding:6px 10px}
.sh{display:flex;align-items:center;gap:6px}
.sh b{flex:1;min-width:0;font-size:14.5px}
.sh small{color:var(--muted);font-size:12px}
.mini-add input[type=text]{padding:3px 10px;font-size:13.5px}
.mini-add .btn{padding:2px 12px}
.edit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.edit input[type=text]{flex:1 1 160px;min-width:0}
.edit .btn{padding:4px 14px}
.lnk{border:0;background:transparent;color:var(--muted);font-weight:600;padding:4px 6px}
.steps{display:flex;gap:5px}
.step{flex:1;min-width:0;border:0;font-size:12.5px;font-weight:600;padding:5px 0;border-radius:9px;background:var(--s);color:var(--c)}
.step.on{background:var(--c);color:var(--paper)}

.bar{height:9px;border-radius:99px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .4s}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav b{font-size:18px}
.nav button{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:4px 14px}
.day{display:flex;flex-direction:column;gap:6px}
.day h3{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.day.today h3{color:var(--accent)}
.day h3 span{font-size:12.5px;color:var(--muted);font-weight:500}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;border-radius:99px;padding:1px 10px;background:var(--s);color:var(--c);font-weight:600}
.pill.on{background:var(--c);color:var(--paper)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--tint);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12.5px;color:var(--muted)}

.add{display:flex;flex-wrap:wrap;gap:6px}
.add input[type=text]{flex:1 1 180px;min-width:0}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.btn{border:0;border-radius:99px;padding:6px 18px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
details>summary{cursor:pointer;color:var(--accent);font-weight:700;list-style:none}
details>summary::-webkit-details-marker{display:none}
.sync{font-size:12px;color:var(--muted);text-align:center}

.tabs{position:fixed;inset:auto 0 0 0;z-index:15;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tabs button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:16px;padding:7px;border-radius:99px}
.tabs button[aria-selected="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on)}
.toast{position:fixed;inset:auto 0 calc(80px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:14px;display:flex;gap:12px;align-items:center;z-index:20}
.toast button{background:transparent;border:0;color:var(--accent-2);font-weight:700;text-decoration:underline}
.login{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;padding:16px}
.login .card{max-width:360px;text-align:center;padding:22px}

.tgrid{display:flex;flex-direction:column;gap:14px}
.tmain,.taside{display:flex;flex-direction:column;gap:14px;min-width:0}
.taside{order:-1}
.sum{display:flex;flex-direction:column;gap:12px}
.sum .ring{flex-direction:row;gap:12px;background:none;justify-content:flex-start}
.sum .ring svg{width:76px;height:76px}
.sum .ring small{font-size:15px;font-weight:700;color:var(--ink)}
.mini3{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px}
.m3{background:var(--s);border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:0}
.m3 b{font-size:20px;font-weight:800;color:var(--c);line-height:1.2;font-variant-numeric:tabular-nums}
.m3 span{font-size:12px;color:var(--muted);line-height:1.3}
.ch3{--c:var(--accent);--s:var(--tint)}
.wat{flex-direction:row;gap:6px}
.wat svg{width:22px;height:38px;flex:none}
.wat>div:nth-child(2){flex:1;min-width:0}
.wat .wb{display:flex;flex-direction:column;gap:4px}
.wat .wbtn{width:28px;height:28px;font-size:17px}
.per-btn{align-self:flex-start;border:1.5px dashed var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:3px 14px;font-weight:600;font-size:13.5px}
.per{background:var(--tint);border-radius:14px;padding:8px 12px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.per .btn{padding:3px 12px;font-size:13px}
.ch{display:flex;flex-direction:column;gap:10px;background:linear-gradient(170deg,var(--paper),var(--tint))}
.ch-h{display:flex;justify-content:space-between;align-items:center}
.ch-h b{font-size:17px;color:var(--accent);display:block}
.ch-h small{color:var(--muted);font-size:13px}
.ch-row{display:flex;align-items:center;gap:10px}
.ch-big{flex:1;font-size:17px;font-weight:700}
.ch-big span{font-size:30px;font-weight:800;color:var(--accent)}
.ch-st{text-align:center;background:var(--paper);border-radius:12px;padding:4px 10px}
.ch-st b{display:block;font-size:18px;font-weight:800;color:var(--accent);line-height:1.2}
.ch-st span{font-size:11.5px;color:var(--muted)}
.ch-btns{display:flex;gap:8px}
.ch-btns .btn{flex:1;padding:8px}
.ch-done{border-radius:12px;padding:6px 10px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.ch-done.ok{background:var(--din-s);color:var(--din)}
.ch-done.slip{background:var(--tint);color:var(--muted)}
.ch-q{margin:0;font-size:14.5px;line-height:1.7;color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:300px;width:100%;margin:0 auto}
.cd{border-radius:5px!important;font-size:8.5px!important}
.cd{aspect-ratio:1;max-width:100%;border-radius:6px;border:1.5px solid var(--line);background:var(--paper);padding:0;font-size:9.5px;font-weight:700;color:var(--muted);display:grid;place-items:center}
.cd.ok{background:var(--accent);border-color:var(--accent);color:var(--on)}
.cd.slip{background:var(--tint);border-color:var(--accent-2)}
.cd.today{box-shadow:0 0 0 2px var(--accent)}
.cd.fut{opacity:.5;cursor:default}
.cd.mile:not(.ok){border-color:var(--accent-2)}
.tlc{display:flex;flex-direction:column;gap:12px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fchip{flex:none;border:1.5px solid var(--line);background:var(--paper);color:var(--muted);border-radius:99px;padding:3px 14px;font-weight:700;font-size:14px}
.fchip.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--paper)}
.fchip.all{--c:var(--accent)}
.blk{display:flex;flex-direction:column}
.bh{display:flex;align-items:center;gap:8px;padding:2px 0 4px;border-bottom:1.5px solid var(--line);margin-bottom:2px}
.bh b{font-size:16px}
.bh small{margin-right:auto;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.nowtag{font-size:11.5px;font-weight:700;color:var(--on);background:var(--accent);border-radius:99px;padding:0 8px}
.blk.now .bh{border-color:var(--accent)}
.tl{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);min-width:0}
.tl:last-child{border-bottom:0}
.tl .tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.tl .tx span{overflow-wrap:anywhere;font-size:15px}
.tl .tx small{color:var(--muted);font-size:12px}
.tl.star .tx span{font-weight:700}
.tl.done .tx span{color:var(--muted);text-decoration:line-through;font-weight:400}
.tl time{flex:none;font-size:12.5px;color:var(--c);font-weight:700;font-variant-numeric:tabular-nums;background:var(--s);border-radius:8px;padding:0 6px}
.tl .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.prog{display:flex;flex-direction:column;gap:8px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12.5px!important;padding:5px 2px!important;border-radius:16px!important}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero{border-radius:24px;padding:16px;display:flex;align-items:center;gap:14px;color:#fff;background:linear-gradient(125deg,var(--accent) 0%,var(--accent-2) 70%,var(--accent-3) 120%);box-shadow:0 14px 30px -18px var(--accent)}
.hring svg{width:84px;height:84px;display:block}
.htx{display:flex;flex-direction:column;gap:2px;min-width:0}
.htx b{font-size:18px;font-weight:800}
.htx span{font-size:14px;opacity:.95}
.hper{background:rgba(255,255,255,.22);border-radius:99px;padding:0 10px;align-self:flex-start}
.dua{background:linear-gradient(160deg,#FFFFFF,#FFF6EC);border-color:#FBE6CF}
.dua .fold{--c:#C9792A;--s:#FBE6CF;border:0;background:transparent}
.dua .fold>summary{padding:0;font-size:16px}
.dua .fold>.in{padding:8px 0 0}
.dua ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.dua li{display:flex;flex-direction:column;gap:0}
.dua .dt{font-size:12px;font-weight:700;color:#C9792A}
.dua p{margin:0;font-size:15.5px;line-height:1.75}
.dua p small{color:var(--muted);font-size:11.5px}
.ttl{font-size:17px;font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ttl small{font-size:12.5px;color:var(--muted);font-weight:500}
.stack{display:flex;flex-direction:column;gap:8px}
.per{background:var(--nafs-s);border-radius:14px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.per .btn{padding:5px 16px;font-size:14px}
.phist{margin:8px 0 0;padding:0 18px 0 0;font-size:13px;color:var(--muted)}
.bi{font-size:16px}
.fchip.din{--c:var(--din)}.fchip.nafs{--c:var(--nafs)}.fchip.ilm{--c:var(--ilm)}.fchip.dev{--c:var(--dev)}
@media (min-width:900px){
  #v-today,#v-study,#v-habits{display:grid;grid-template-columns:1fr 1fr;align-items:start}
  #v-today>.hero,#v-today>.dua{grid-column:1/-1}
  .tgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
  .taside{order:0;position:sticky;top:14px}

    if(same){if(t.done){same.done=true;same.doneAt=t.doneAt||same.date}return}
    if(!isSeed(t.id))N.tasks.push({id:t.id,title:t.title,sec:t.sec||SEC[t.area]||"work",date:t.date||null,done:!!t.done,doneAt:t.doneAt||null});
  });
  const KEY=[[/قيام الليل/,["qiyam"]],[/استخارة/,["istikhara"]],[/صلاة الضحى/,["duha"]],[/أذكار الصباح/,["sabah"]],[/أذكار المساء/,["masa"]],[/أذكار النوم/,["nawm"]],[/رقية/,["ruqya"]],[/سورة البقرة/,["baqara"]],[/دولينجو/,["duo"]],[/سلسلة «نور»/,["nour"]],[/لا تحزن/,["latahzan"]],[/3 أشياء/,["three"]],[/مذاكرة الجامعة/,["uni"]],[/زوم مباشر/,["zoom"]],[/ملخص زوم/,["zoomsum"]],[/لينكدإن/,["linkedin"]],[/الدعم النفسي/,["support"]],[/سراج/,["siraj"]],[/بودكاست/,["podcast"]],[/امتنان/,["gratitude"]]];
  const rTitle={};Object.values(old.routine||{}).forEach(a=>(a||[]).forEach(r=>rTitle[r.id]=r.title));
  Object.entries(old.routineDone||{}).forEach(([day,ids])=>{if(day<START)return;(ids||[]).forEach(id=>{const ti=rTitle[id]||"";KEY.forEach(([re,ks])=>{if(re.test(ti))ks.forEach(k=>{(N.checks[day]=N.checks[day]||{})[k]=true})})})});
  Object.entries(old.goals||{}).forEach(([mk,arr])=>{const dest=N.goals[mk]=N.goals[mk]||[];(arr||[]).forEach(g=>{const same=dest.find(x=>x.id===g.id)||dest.find(x=>x.title===g.title);if(same&&same.id===g.id){same.title=g.title;same.done=!!g.done;return}if(same){if(g.done)same.done=true}else if(!isSeed(g.id))dest.push({id:g.id,title:g.title,sec:g.sec||SEC[g.area]||"dev",done:!!g.done})})});
  return norm(N);
}

/* ---------- courses & auto plan ---------- */
const course=id=>S.courses.find(c=>c.id===id);
const unitLabel=u=>{const[c,n]=u.split(":");const co=course(c);return co?`${co.short||co.name} · ${co.unit} ${n}`:u};
const doneAt=u=>S.units[u]||null;
const slotsFor=k=>dow(k)===5?1:2;
function fullQueue(){const q=S.queue.filter(u=>course(u.split(":")[0]));
  S.courses.forEach(c=>{for(let n=1;n<=c.total;n++){const u=c.id+":"+n;if(!q.includes(u))q.push(u)}});
  return q.filter(u=>+u.split(":")[1]<=course(u.split(":")[0]).total)}
function eligible(u,k){const[c,n]=u.split(":");const r=(course(c).release||[])[n-1];return !r||r<=k}
function allocate(){
  const T=TODAY(),Q=fullQueue(),res={};
  Q.forEach(u=>{const d=doneAt(u);if(d&&d<T)(res[d]=res[d]||[]).push({u,done:true})});
  let rem=Q.filter(u=>!doneAt(u));
  const take=(k,n)=>{const out=[];for(let i=0;i<rem.length&&out.length<n;){if(eligible(rem[i],k))out.push(rem.splice(i,1)[0]);else i++}return out};
  const dT=Q.filter(u=>doneAt(u)===T);
  res[T]=dT.map(u=>({u,done:true})).concat(take(T,Math.max(0,slotsFor(T)-dT.length)).map(u=>({u,done:false})));
  let k=T,g=0;while(rem.length&&g<200){k=ymd(addDays(parse(k),1));g++;res[k]=take(k,slotsFor(k)).map(u=>({u,done:false}))}
  return res;
}

const onDay=(days,k)=>days.includes(dow(k));
function model(k){
  const T=TODAY(),C=S.checks[k]||{},isT=k===T;
  const ck=(key,label,extra)=>Object.assign({key,label,done:!!C[key],act:`data-act="c" data-k="${key}" data-d="${k}"`},extra||{});
  const tasksOf=sec=>S.tasks.filter(t=>t.sec===sec&&t.date===k);
  const trow=t=>({label:t.title,done:t.done,act:`data-act="t" data-id="${t.id}"`,meta:t.date<k?"متأخر":"",late:t.date<k,del:t.id,edit:{type:"task",id:t.id}});
  const studied=S.uni.flatMap(s=>s.items.filter(i=>i.doneAt===k).map(i=>s.name));
  const quran=(HALLOC[k]||[]).map(p=>({label:`حفظ جديد: ${hSurah(p)} ص ${p}`,done:hDone(p)===k||(!!hDone(p)&&k<T),act:`data-act="h" data-p="${p}"`})).concat(tasksOf("din").map(trow));quran.push(ck("baqara","سورة البقرة"));
  const focus=(ALLOC[k]||[]).map((x,i)=>({u:x.u,label:unitLabel(x.u),done:doneAt(x.u)===k||(k<T&&x.done),slot:i}));
  const m={
    din:{prayers:isPeriod(k)?[]:PRAYERS.map(([a,b])=>ck(a,b)),azkar:AZKAR.map(([a,b])=>ck(a,b)),quran},
    nafs:{water:S.water[k]||0,habits:HABITS.map(([a,b])=>ck(a,b)),heart:HEART.filter(h=>onDay(h[2],k)&&(!h[3]||k>=h[3])).map(([a,b])=>ck(a,b)).concat(tasksOf("nafs").map(trow))},
    ilm:{focus,rows:ILM.filter(r=>onDay(r[3],k)).map(([a,b,c])=>a==="uni"?ck(a,b,{done:!!C.uni||studied.length>0,meta:studied.length?"درستِ: "+[...new Set(studied)].join("، "):""}):ck(a,b,{meta:c})).concat(tasksOf("ilm").map(trow))},
    dev:{chips:DEV.filter(r=>onDay(r[2],k)).map(([a,b])=>ck(a,b)),rows:tasksOf("dev").map(trow)},
    work:{rows:tasksOf("work").map(trow)}
  };
  const cnt={din:[...m.din.prayers,...m.din.azkar,...m.din.quran],nafs:[{done:m.nafs.water>=1},...m.nafs.habits,...m.nafs.heart],ilm:[...focus,...m.ilm.rows],dev:[...m.dev.chips,...m.dev.rows],work:m.work.rows};
  m.count={};let d=0,t=0;for(const s in cnt){const a=cnt[s].filter(x=>x.done).length;m.count[s]=[a,cnt[s].length];d+=a;t+=cnt[s].length}
  m.total=[d,t];m.C=C;m.period=isPeriod(k);m.late=isT?S.tasks.filter(t=>t.date&&t.date>=START&&t.date<k&&!t.done).sort((a,b)=>a.date.localeCompare(b.date)).map(t=>Object.assign(trow(t),{meta:fmtDay(t.date).split(" ").slice(1).join(" ")})):[];return m;
}
function routineDone(item,k,m){const key=item[2];

function renderWeek(T){
  const ws=addDays(weekStart(new Date()),weekOff*7),we=addDays(ws,6);
  $("w-title").textContent=(weekOff===0?"هذا الأسبوع · ":"")+ws.getDate()+" "+MONTHS[ws.getMonth()]+" – "+we.getDate()+" "+MONTHS[we.getMonth()];
  let D=0,Tt=0,html="";HALLOC=allocHifz();ALLOC=allocate();
  for(let i=0;i<7;i++){const k=ymd(addDays(ws,i));if(k<START)continue;const m=model(k);const fut=k>T;
    if(!fut){D+=m.total[0];Tt+=m.total[1]}
    const q=(HALLOC[k]||[]).map(p=>({title:`حفظ ${hSurah(p)} ص ${p}`,done:!!hDone(p)})).concat(S.tasks.filter(t=>t.date===k&&t.sec==="din"));const wk=S.tasks.filter(t=>t.date===k&&t.sec!=="din");
    const pr=m.din.prayers.filter(x=>x.done).length;
    html+=`<div class="card day ${k===T?"today":""}"><h3>${fmtDay(k)}<span>${fut?"جاي":Math.round(m.total[0]/(m.total[1]||1)*100)+"%"}</span></h3>
      ${m.ilm.focus.length?`<div class="mini ilm">${m.ilm.focus.map(f=>`<span class="pill ${f.done?"on":""}">${esc(f.label)}</span>`).join("")}</div>`:""}
      ${q.length?`<div class="mini din">${q.map(t=>`<span class="pill ${t.done?"on":""}">${fx(t.title)}</span>`).join("")}</div>`:""}
      ${wk.length?`<div class="mini work">${wk.map(t=>`<span class="pill ${t.done?"on":""}">${fx(t.title)}</span>`).join("")}</div>`:""}
      ${fut?"":`<div class="note">${m.period?"🩸 أيام الدورة":"الصلوات "+pr+"/8"} · المطرة ${m.nafs.water>=1?"✓":"✗"} · الأذكار ${m.din.azkar.filter(x=>x.done).length}/4</div>`}</div>`}
  $("w-days").innerHTML=html||`<div class="card empty">الخطة بتبلش من الإثنين 19 أكتوبر.</div>`;
  $("w-bar").style.width=(Tt?D/Tt*100:0)+"%";$("w-sum").textContent=Tt?`أنجزتِ ${D} من ${Tt} لحد اليوم`:"";
}
function renderMonth(T){
  const md=new Date(new Date().getFullYear(),new Date().getMonth()+monthOff,1),mk=mkey(md);
  $("m-title").textContent=MONTHS[md.getMonth()]+" "+md.getFullYear();
  const days=[];for(let d=new Date(md);d.getMonth()===md.getMonth();d=addDays(d,1)){const k=ymd(d);if(k>=START&&k<=T)days.push(k)}
  let pr=0,az=0,wt=0,pd=0,all=[0,0];days.forEach(k=>{const m=model(k);if(!m.period)pd++;pr+=m.din.prayers.filter(x=>x.done).length;az+=m.din.azkar.filter(x=>x.done).length;wt+=m.nafs.water>=1?1:0;all[0]+=m.total[0];all[1]+=m.total[1]});
  const n=days.length||1;
  $("m-stats").innerHTML=[[Math.round(all[0]/(all[1]||1)*100)+"%","إنجاز الشهر"],[Math.round(pr/((pd||1)*8)*100)+"%","الصلوات"],[Math.round(az/(n*4)*100)+"%","الأذكار"],[wt+"/"+days.length,"أيام المطرة"]].map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
  const gs=S.goals[mk]||[],gd=gs.filter(g=>g.done).length;
  $("m-bar").style.width=(gs.length?gd/gs.length*100:0)+"%";$("m-gsum").textContent=gs.length?`${gd} من ${gs.length}`:"";
  $("g-sec").innerHTML=SECS.map(([a,b])=>`<option value="${a}">${b}</option>`).join("");
  $("g-list").innerHTML=gs.length?SECS.map(([a,b])=>{const g=gs.filter(x=>(x.sec||"dev")===a);if(!g.length)return"";return `<div class="${a}"><div class="lbl" style="color:var(--c)">${b}</div><div class="rows">${g.map(x=>row({label:x.title,done:x.done,act:`data-act="g" data-id="${x.id}"`,edit:{type:"goal",id:x.id},delAct:`data-act="gd" data-id="${x.id}"`})).join("")}</div></div>`}).join(""):`<p class="empty">اكتبي أهداف الشهر هون.</p>`;
  $("carry-wrap").hidden=!(gs.length&&gs.some(g=>!g.done));
}

/* ---------- actions ---------- */
function toast(msg,undo){$("toast-msg").textContent=msg;$("toast-undo").hidden=!undo;lastUndo=undo||null;$("toast").hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").hidden=true,4000)}
$("toast-undo").onclick=()=>{if(lastUndo){lastUndo();lastUndo=null;save();render()}$("toast").hidden=true};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const T=TODAY(),a=b.dataset.act;
  if(a==="c"){const k=b.dataset.d||T;const C=S.checks[k]=S.checks[k]||{};C[b.dataset.k]=!C[b.dataset.k];if(!C[b.dataset.k])delete C[b.dataset.k]}
  else if(a==="w"){S.water[T]=Math.max(0,(S.water[T]||0)+(+b.dataset.n))}
  else if(a==="t"){const t=S.tasks.find(x=>x.id===b.dataset.id);if(!t)return;t.done=!t.done;t.doneAt=t.done?T:null}
  else if(a==="td"){const i=S.tasks.findIndex(x=>x.id===b.dataset.id);if(i<0)return;const t=S.tasks.splice(i,1)[0];S.deleted.push(t.id);toast("انحذفت المهمة",()=>{S.tasks.splice(i,0,t);S.deleted=S.deleted.filter(x=>x!==t.id)})}
  else if(a==="flt"){FILTER=b.dataset.v;try{localStorage.setItem("np-filter",FILTER)}catch(_){}render();return}
  else if(a==="per"){S.periods=S.periods||[];if(b.dataset.v==="start"){S.periods.push({from:T,to:null});toast("🩸 انشالت الصلوات لحد ما تخلص")}else{const p=S.periods.find(p=>!p.to||p.to>=T);if(p){p.to=ymd(addDays(parse(T),-1));if(p.to<p.from)S.periods=S.periods.filter(x=>x!==p)}toast("الحمد لله على السلامة 🌸")}}
  else if(a==="chd"){const v=b.dataset.v;if(v)S.challenge.days[b.dataset.d]=v;else delete S.challenge.days[b.dataset.d];if(v==="ok"){const c=chInfo().clean;if(CH_MILES[c])toast(CH_MILES[c])}}
  else if(a==="chc"){const k=b.dataset.d,v=S.challenge.days[k];if(!v)S.challenge.days[k]="ok";else if(v==="ok")S.challenge.days[k]="slip";else delete S.challenge.days[k]}
  else if(a==="ed"){EDIT={type:b.dataset.type,id:b.dataset.id};render();const f=document.querySelector('form.edit input[name="title"]');if(f){f.focus();f.select()}return}
  else if(a==="edc"){EDIT=null;render();return}
  else if(a==="ui"){const[x,y]=b.dataset.id.split(":");const it=(S.uni.find(s=>s.id===x)||{items:[]}).items.find(i=>i.id===y);if(!it)return;it.doneAt=it.doneAt?null:T}
  else if(a==="uid"){const[x,y]=b.dataset.id.split(":");const s=S.uni.find(q=>q.id===x);if(!s)return;const i=s.items.findIndex(q=>q.id===y);const it=s.items.splice(i,1)[0];toast("انحذفت",()=>s.items.splice(i,0,it))}
  else if(a==="sd"){const i=S.uni.findIndex(q=>q.id===b.dataset.id);if(i<0)return;const s=S.uni.splice(i,1)[0];toast("انحذف المساق «"+s.name+"»",()=>S.uni.splice(i,0,s))}
  else if(a==="gd"){const mk=mkey(new Date(new Date().getFullYear(),new Date().getMonth()+monthOff,1));const arr=S.goals[mk]||[];const i=arr.findIndex(x=>x.id===b.dataset.id);if(i<0)return;const g=arr.splice(i,1)[0];toast("انحذف الهدف",()=>arr.splice(i,0,g))}
  else if(a==="f"||a==="u"){const u=b.dataset.u;if(S.units[u])delete S.units[u];else S.units[u]=T}
  else if(a==="h"){const p=b.dataset.p;if(S.hifz.done[p])delete S.hifz.done[p];else S.hifz.done[p]=T}
  else if(a==="g"){const mk=mkey(new Date(new Date().getFullYear(),new Date().getMonth()+monthOff,1));const g=(S.goals[mk]||[]).find(x=>x.id===b.dataset.id);if(g)g.done=!g.done}
  else return;
  save();render()});
document.addEventListener("toggle",e=>{const d=e.target;if(!d.dataset)return;if(d.dataset.inv){if(d.open)OPEN.delete(d.dataset.inv);else OPEN.add(d.dataset.inv)}else if(d.dataset.ok){if(d.open)OPEN.add(d.dataset.ok);else OPEN.delete(d.dataset.ok)}else return;try{localStorage.setItem("np-open",JSON.stringify([...OPEN]))}catch(_){}},true);
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,T=TODAY(),fd=new FormData(f),ff=f.dataset.form;
  if(ff==="edit"){const title=String(fd.get("title")||"").trim();if(!title&&f.dataset.type!=="ch")return;const o=editVal({type:f.dataset.type,id:f.dataset.id});if(!o)return;
    if(f.dataset.type==="task"){o.title=title;o.date=fd.get("date")||null;o.sec=fd.get("sec")||o.sec}
    else if(f.dataset.type==="ch"){S.challenge.title=title}
    else if(f.dataset.type==="subj"){S.uni.find(x=>x.id===f.dataset.id).name=title}
    else o.title=title;
    EDIT=null;save();render();toast("انحفظ التعديل ✓");return}
  if(ff==="uitem"){const t=String(fd.get("t")||"").trim();const s=S.uni.find(x=>x.id===f.dataset.s);if(!t||!s)return;s.items.push({id:uid(),title:t,doneAt:null});save();render();
    const inp=document.querySelector(`form[data-s="${s.id}"] input`);if(inp)inp.focus();return}
  if(ff==="subj"){const n=String(fd.get("n")||"").trim();if(!n)return;const c=Math.max(0,Math.min(60,+fd.get("c")||0));
    S.uni.push({id:uid(),name:n,items:Array.from({length:c},(_,i)=>({id:uid(),title:"محاضرة "+(i+1),doneAt:null}))});OPEN.add("uni");save();render();toast("انضاف المساق ✓");return}
  if(f.id==="f-task"){const title=$("t-title").value.trim();if(!title)return;const w=$("t-when").value;
    const date=w==="today"?T:w==="tomorrow"?ymd(addDays(new Date(),1)):w==="date"?($("t-date").value||T):null;
    S.tasks.push({id:uid(),title,sec:$("t-sec").value,date,done:false,doneAt:null});toast("انضافت ✓")}
  else if(f.id==="f-goal"){const title=$("g-title").value.trim();if(!title)return;const mk=mkey(new Date(new Date().getFullYear(),new Date().getMonth()+monthOff,1));
    (S.goals[mk]=S.goals[mk]||[]).push({id:uid(),title,sec:$("g-sec").value,done:false});$("g-title").value=""}
  else if(f.id==="f-course"){const name=$("c-name").value.trim();if(!name)return;const total=Math.max(1,Math.min(60,+$("c-total").value||1));
    S.courses.push({id:"c"+uid(),name,short:name,unit:$("c-unit").value.trim()||"محاضرة",total});$("c-name").value="";toast("انضاف الكورس ✓")}
  else return;save();render()});
document.addEventListener("change",e=>{if(e.target.id==="t-when")$("t-date").hidden=e.target.value!=="date"});
for(const b of document.querySelectorAll(".tabs button"))b.onclick=()=>{view=b.dataset.v;render();window.scrollTo(0,0);try{localStorage.setItem("np-view",view)}catch(e){}};
try{const v=localStorage.getItem("np-view");if(["today","study","habits","week","month"].includes(v))view=v}catch(e){}
$("w-prev").onclick=()=>{weekOff--;render()};$("w-next").onclick=()=>{weekOff++;render()};
$("m-prev").onclick=()=>{monthOff--;render()};$("m-next").onclick=()=>{monthOff++;render()};
$("carry").onclick=()=>{const n=new Date(),cur=new Date(n.getFullYear(),n.getMonth()+monthOff,1),ck=mkey(cur),nk=mkey(new Date(cur.getFullYear(),cur.getMonth()+1,1));
  const dest=S.goals[nk]=S.goals[nk]||[];let c=0;(S.goals[ck]||[]).filter(g=>!g.done).forEach(g=>{if(!dest.some(x=>x.title===g.title)){dest.push({id:uid(),title:g.title,sec:g.sec,done:false});c++}});
  toast(c?`انتقل ${c} هدف للشهر الجاي`:"كلهم منقولين من قبل");save();render()};
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
setInterval(()=>{if(!document.hidden)render()},60000);

/* ---------- firebase ---------- */
if(typeof firebase==="undefined"){$("login").hidden=true;if(!S.courses.length&&SEED)S=norm(SEED);render();$("sync").textContent="ما في اتصال، الحفظ على هذا الجهاز";return}
firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth(),fdb=firebase.firestore();
auth.onAuthStateChanged(u=>{
  $("login").hidden=!!u;$("logout").hidden=!u;
  if(!u){ref=null;return}
  ref={_d:fdb.collection("planners").doc(u.uid),set(o){return this._d.set(o)}};
  ref._d.onSnapshot(snap=>{if(snap.metadata.hasPendingWrites)return;
    if(snap.exists){const d=snap.data();if(SEED&&(d.seedVersion||0)<SEED.seedVersion){S=migrate(d);local(true);render();flush();return}S=norm(d);local(true);render();$("sync").textContent="محفوظ ✓"}
    else{if(SEED)S=norm(SEED);render();flush()}},e=>{$("sync").textContent="ما قدرت أوصل للبيانات: "+e.message});
});
$("login-btn").onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();
  try{await auth.signInWithPopup(p)}catch(e){if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")auth.signInWithRedirect(p);else $("login-err").textContent="ما زبط الدخول: "+e.message}};
$("logout").onclick=()=>auth.signOut();
render();
})();
</script>
