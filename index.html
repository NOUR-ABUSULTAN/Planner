<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E0558A">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">

<title>دفتر نور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: phone-first day page — progress ring + small routine box, then four colored section cards (ديني/نفسي/علمي/تطوير) + work; bottom tab bar. Wide screens: routine becomes a sticky sidebar. */
:root{
  --bg:#FFF4F7; --paper:#FFFFFF; --ink:#3B1F2E; --muted:#9A7084; --line:#F5D6E2; --tint:#FFEAF1;
  --accent:#E0558A; --accent-2:#F49A7C; --on:#FFFFFF; --late:#C9364F;
  --din:#2A9A80; --din-s:#E3F5EF; --nafs:#D9487D; --nafs-s:#FDE2EC; --ilm:#7559C9; --ilm-s:#ECE6FA;
  --dev:#D97A3F; --dev-s:#FCEBDD; --work:#A77A90; --work-s:#F6EAF0;
  --font:"Baloo Bhaijaan 2",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1018; --paper:#2A1823; --ink:#FBE9F0; --muted:#C79BAF; --line:#432636; --tint:#331B29;
  --accent:#FF86B1; --accent-2:#FFB199; --on:#2A0F1D; --late:#FF8A97;
  --din:#5FD1B4; --din-s:#173A31; --nafs:#FF86B1; --nafs-s:#3D2030; --ilm:#B4A0F5; --ilm-s:#2C2547;
  --dev:#FFB07A; --dev-s:#3D2A1D; --work:#D9AFC3; --work-s:#3A2632; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1018; --paper:#2A1823; --ink:#FBE9F0; --muted:#C79BAF; --line:#432636; --tint:#331B29;
  --accent:#FF86B1; --accent-2:#FFB199; --on:#2A0F1D; --late:#FF8A97;
  --din:#5FD1B4; --din-s:#173A31; --nafs:#FF86B1; --nafs-s:#3D2030; --ilm:#B4A0F5; --ilm-s:#2C2547;
  --dev:#FFB07A; --dev-s:#3D2A1D; --work:#D9AFC3; --work-s:#3A2632; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:28px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:6px;line-height:1.2}
h1 svg{width:28px;height:28px;animation:sway 6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(18deg)}}
.date{color:var(--muted);font-size:12.5px;text-align:left;line-height:1.35}
.hello{margin:2px 0 14px;font-size:17px;font-weight:700}
.hello span{font-weight:400;color:var(--muted);font-size:14px}

.view{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px}
.top{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 6px 16px -14px var(--accent)}
.ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(160deg,var(--paper),var(--tint))}
.ring svg{width:104px;height:104px}
.ring small{color:var(--muted);font-size:13px}
.rt h3{margin:0 0 4px;font-size:14px;color:var(--accent)}
.rt ul{list-style:none;margin:0;padding:0}
.rt li{display:flex;gap:7px;align-items:center;padding:1px 4px;margin:0 -4px;font-size:13px;border-radius:8px}
.rt li b{font-weight:400;color:var(--muted);width:38px;flex:none;font-variant-numeric:tabular-nums;font-size:12px}
.rt li i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--accent);flex:none}
.rt li.d i{background:var(--accent)}
.rt li.d span{color:var(--muted);text-decoration:line-through}
.rt li.now{background:var(--tint);font-weight:700}

.sec{border-radius:22px;overflow:hidden;background:var(--paper);border:1px solid var(--line)}
.sec>header{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;color:var(--paper);font-weight:800;font-size:18px;background:var(--c)}
.sec>header em{font-style:normal;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--paper) 28%,transparent);padding:1px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
.din{--c:var(--din);--s:var(--din-s)} .nafs{--c:var(--nafs);--s:var(--nafs-s)} .ilm{--c:var(--ilm);--s:var(--ilm-s)} .dev{--c:var(--dev);--s:var(--dev-s)} .work{--c:var(--work);--s:var(--work-s)}
.body{padding:10px 16px 14px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:5px;display:flex;justify-content:space-between;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--c);color:var(--c);background:transparent;border-radius:99px;padding:3px 13px;font-size:14px;font-weight:600;transition:background .15s,color .15s}
.chip.on{background:var(--c);color:var(--paper)}
.chip:active{transform:scale(.95)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);min-width:0}
.row:last-child{border-bottom:0}
.ck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--c);background:transparent;display:grid;place-items:center;padding:0;color:var(--paper)}
.ck.on{background:var(--c)}
.ck.on::after{content:"";width:9px;height:5px;border:2px solid currentColor;border-top:0;border-right:0;transform:rotate(-45deg) translate(0,-1px)}
.ck:active{transform:scale(.88)}
.txt{flex:1;min-width:0;overflow-wrap:anywhere}
.row.done .txt{color:var(--muted);text-decoration:line-through}
.meta{flex:none;color:var(--muted);font-size:12px}
.meta.late{color:var(--late);font-weight:700}
.x{flex:none;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.empty{color:var(--muted);font-size:13px}

.water{display:flex;align-items:center;gap:12px;background:var(--s);border-radius:16px;padding:8px 12px}
.water svg{width:34px;height:56px;flex:none}
.water .wt{flex:1;min-width:0}
.water .wt b{display:block;font-size:15px}
.water .wt span{font-size:12.5px;color:var(--muted)}
.wbtns{display:flex;gap:6px}
.wbtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--c);color:var(--paper);font-size:20px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0}
.wbtn.minus{background:transparent;color:var(--c);border:1.5px solid var(--c)}

.focus{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.fc{display:flex;gap:8px;align-items:center;text-align:right;background:var(--s);border:0;border-radius:14px;padding:8px 10px;min-width:0}
.fc .t{flex:1;min-width:0}
.fc small{display:block;font-size:11.5px;color:var(--c);font-weight:700}
.fc span{font-size:14.5px;font-weight:700}
.fc.done span{color:var(--muted);text-decoration:line-through}
.course{border:1px solid var(--s);border-radius:14px;padding:8px 10px;background:color-mix(in srgb,var(--s) 35%,var(--paper))}
.course .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-size:14.5px;margin-bottom:6px}
.course .t small{color:var(--muted);font-weight:400;font-size:12px}
.boxes{display:flex;flex-wrap:wrap;gap:6px}
.box{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--c);color:var(--c);background:transparent;display:grid;place-items:center;font-size:14px;font-weight:700;padding:0;font-variant-numeric:tabular-nums}
.box.on{background:var(--c);color:var(--paper)}
.box.next{border-width:2.5px;box-shadow:0 0 0 3px var(--s)}
.box.locked{opacity:.45}
.note{font-size:12.5px;color:var(--muted)}
.hs{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.hn{font-size:13.5px;font-weight:700;color:var(--c)}
.hn small{color:var(--muted);font-weight:400}
.box.pg{width:auto;min-width:42px;padding:0 6px;font-size:13px}
.steps{display:flex;gap:5px}
.step{flex:1;min-width:0;border:0;font-size:12.5px;font-weight:600;padding:5px 0;border-radius:9px;background:var(--s);color:var(--c)}
.step.on{background:var(--c);color:var(--paper)}

.bar{height:9px;border-radius:99px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .4s}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav b{font-size:18px}
.nav button{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:4px 14px}
.day{display:flex;flex-direction:column;gap:6px}
.day h3{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.day.today h3{color:var(--accent)}
.day h3 span{font-size:12.5px;color:var(--muted);font-weight:500}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;border-radius:99px;padding:1px 10px;background:var(--s);color:var(--c);font-weight:600}
.pill.on{background:var(--c);color:var(--paper)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--tint);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12.5px;color:var(--muted)}

.add{display:flex;flex-wrap:wrap;gap:6px}
.add input[type=text]{flex:1 1 180px;min-width:0}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.btn{border:0;border-radius:99px;padding:6px 18px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
details>summary{cursor:pointer;color:var(--accent);font-weight:700;list-style:none}
details>summary::-webkit-details-marker{display:none}
.sync{font-size:12px;color:var(--muted);text-align:center}

.tabs{position:fixed;inset:auto 0 0 0;z-index:15;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabs div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:16px;padding:7px;border-radius:99px}
.tabs button[aria-selected="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on)}
.toast{position:fixed;inset:auto 0 calc(80px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:14px;display:flex;gap:12px;align-items:center;z-index:20}
.toast button{background:transparent;border:0;color:var(--accent-2);font-weight:700;text-decoration:underline}
.login{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;padding:16px}
.login .card{max-width:360px;text-align:center;padding:22px}

@media (min-width:900px){
  .today-grid{display:grid;grid-template-columns:1fr 290px;gap:16px;align-items:start}
  .side{position:sticky;top:14px;display:flex;flex-direction:column;gap:12px}
  .side .top{grid-template-columns:1fr}
  .secs{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
}
@media (max-width:899px){.today-grid{display:flex;flex-direction:column;gap:14px}.secs{display:flex;flex-direction:column;gap:14px}.side{order:-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1><svg viewBox="0 0 40 40" aria-hidden="true"><g fill="var(--accent)" opacity=".85"><circle cx="20" cy="10" r="7"/><circle cx="29.5" cy="17" r="7"/><circle cx="26" cy="28" r="7"/><circle cx="14" cy="28" r="7"/><circle cx="10.5" cy="17" r="7"/></g><circle cx="20" cy="20" r="5" fill="var(--accent-2)"/></svg>دفتر نور</h1>
    <div class="date" id="date"></div>
  </div>
  <p class="hello" id="hello"></p>

  <!-- TODAY -->
  <section class="view" id="v-today">
    <div class="today-grid">
      <div class="secs" id="secs"></div>
      <aside class="side"><div class="top" id="top"></div></aside>
    </div>
  </section>

  <!-- WEEK -->
  <section class="view" id="v-week" hidden>
    <div class="card"><div class="nav"><button id="w-prev" aria-label="الأسبوع السابق">→</button><b id="w-title"></b><button id="w-next" aria-label="الأسبوع التالي">←</button></div>
      <div class="bar" style="margin-top:10px"><i id="w-bar"></i></div><div class="note" id="w-sum" style="margin-top:4px"></div></div>
    <div class="grid" id="w-days"></div>
  </section>

  <!-- MONTH -->
  <section class="view" id="v-month" hidden>
    <div class="card"><div class="nav"><button id="m-prev" aria-label="الشهر السابق">→</button><b id="m-title"></b><button id="m-next" aria-label="الشهر التالي">←</button></div></div>
    <div class="stats" id="m-stats"></div>
    <div class="sec ilm"><header>الحفظ والكورسات</header><div class="body" id="m-courses"></div></div>
    <div class="card"><div class="lbl" style="font-size:16px;color:var(--ink)">أهداف الشهر <span id="m-gsum"></span></div>
      <div class="bar"><i id="m-bar"></i></div>
      <div id="g-list" style="margin-top:8px"></div>
      <form class="add" id="f-goal" style="margin-top:8px"><input type="text" id="g-title" placeholder="هدف جديد لهالشهر" autocomplete="off" required><select id="g-sec" aria-label="القسم"></select><button class="btn" type="submit">إضافة</button></form>
      <div id="carry-wrap" hidden style="margin-top:8px"><button class="btn ghost" id="carry" type="button">انقلي اللي ما خلص للشهر الجاي</button></div>
    </div>
    <div class="card"><details><summary>+ إضافة كورس جديد</summary>
      <form class="add" id="f-course" style="margin-top:8px"><input type="text" id="c-name" placeholder="اسم الكورس" autocomplete="off" required><input type="text" id="c-unit" placeholder="محاضرة / فيديو" autocomplete="off" style="flex:0 1 120px"><input type="number" id="c-total" min="1" max="60" value="5" aria-label="العدد" style="width:72px"><button class="btn" type="submit">إضافة</button></form></details></div>
    <div class="sync" id="sync"></div>
    <div style="text-align:center"><button class="btn ghost" id="logout" type="button" hidden>تسجيل خروج</button></div>
  </section>
</div>

<nav class="tabs" role="tablist"><div>
  <button role="tab" data-v="today" id="tab-today" aria-selected="true">اليوم</button>
  <button role="tab" data-v="week" id="tab-week" aria-selected="false">الأسبوع</button>
  <button role="tab" data-v="month" id="tab-month" aria-selected="false">الشهر</button>
</div></nav>
<div class="toast" id="toast" hidden><span id="toast-msg"></span><button id="toast-undo" type="button">تراجع</button></div>

  const quran=(HALLOC[k]||[]).map(p=>({label:`حفظ جديد: ${hSurah(p)} ص ${p}`,done:hDone(p)===k||(!!hDone(p)&&k<T),act:`data-act="h" data-p="${p}"`})).concat(tasksOf("din").map(trow));quran.push(ck("baqara","سورة البقرة"));
  const focus=(ALLOC[k]||[]).map((x,i)=>({u:x.u,label:unitLabel(x.u),done:doneAt(x.u)===k||(k<T&&x.done),slot:i}));
  const m={
    din:{prayers:PRAYERS.map(([a,b])=>ck(a,b)),azkar:AZKAR.map(([a,b])=>ck(a,b)),quran},
    nafs:{water:S.water[k]||0,habits:HABITS.map(([a,b])=>ck(a,b)),heart:HEART.filter(h=>onDay(h[2],k)).map(([a,b])=>ck(a,b)).concat(tasksOf("nafs").map(trow))},
    ilm:{focus,rows:ILM.filter(r=>onDay(r[3],k)).map(([a,b,c])=>ck(a,b,{meta:c})).concat(tasksOf("ilm").map(trow))},
    dev:{chips:DEV.filter(r=>onDay(r[2],k)).map(([a,b])=>ck(a,b)),rows:tasksOf("dev").map(trow)},

  const cnt={din:[...m.din.prayers,...m.din.azkar,...m.din.quran],nafs:[{done:m.nafs.water>=1},...m.nafs.habits,...m.nafs.heart],ilm:[...focus,...m.ilm.rows],dev:[...m.dev.chips,...m.dev.rows],work:m.work.rows};

}
function routineDone(item,k,m){const key=item[2];

  if(key==="hifz"){const h=HALLOC[k]||[];return h.length>0&&h.every(p=>hDone(p))}
  if(key==="tasmee"){const h=S.tasks.filter(t=>t.date===k&&/^تسميع/.test(t.title));return h.length?h.every(t=>t.done):!!m.C.tasmee}
  if(key==="work"){const w=m.work.rows;return w.length>0&&w.every(t=>t.done)}
  if(key==="f1")return !!(m.ilm.focus[0]&&m.ilm.focus[0].done);
  if(key==="f2")return !!(m.ilm.focus[1]&&m.ilm.focus[1].done);
  return false}

  ref._d.onSnapshot(snap=>{if(snap.metadata.hasPendingWrites)return;
    if(snap.exists){const d=snap.data();if(SEED&&(d.seedVersion||0)<SEED.seedVersion){S=migrate(d);local(true);render();flush();return}S=norm(d);local(true);render();$("sync").textContent="محفوظ ✓"}
    else{if(SEED)S=norm(SEED);render();flush()}},e=>{$("sync").textContent="ما قدرت أوصل للبيانات: "+e.message});
});
$("login-btn").onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();
  try{await auth.signInWithPopup(p)}catch(e){if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")auth.signInWithRedirect(p);else $("login-err").textContent="ما زبط الدخول: "+e.message}};
$("logout").onclick=()=>auth.signOut();
render();
})();
</script>
